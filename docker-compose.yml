# =============================================================================
# WeChat AI Panel (Go) - Docker Compose 示例
#
# 用法:
#   1. docker compose up -d --build
#   2. 浏览器打开 http://localhost:8081 (面板)
#   3. 面板内引导安装 AstrBot / wechat-bot 依赖并扫码登录
#
# 数据持久化: ./data 目录挂载到容器, 保存 wechat-bot 源码、AstrBot 数据、配置。
# 注意: 容器内面板以 root 运行; 如需更严格隔离可改 user。
# =============================================================================

services:
  panel:
    build: .
    image: wechat-ai-panel:latest
    container_name: wechat-ai-panel
    restart: unless-stopped
    ports:
      - "8081:8081"   # 面板
      - "6185:6185"   # AstrBot WebUI
      - "20129:20129" # AstrBot OneBot WS
      - "6189:6189"   # wechat-bot API
      - "8090:8090"   # qr-server
    volumes:
      - ./data/wechat-bot:/app/wechat-bot-windows      # wechat-bot 源码 (面板可 clone)
      - ./data/astrbot:/app/.astrbot-root              # AstrBot 根目录
      - ./data/astrbot-data:/app/.astrbot-data         # AstrBot 数据
      - ./data/cmd_config:/app/cmd_config              # AstrBot cmd_config.json
      - ./data/logs:/app/logs                          # 面板日志
    environment:
      - TZ=Asia/Shanghai
    # 需要修改端口/路径时, 可挂载自定义配置覆盖:
    # - ./config.local.json:/app/config.local.json
